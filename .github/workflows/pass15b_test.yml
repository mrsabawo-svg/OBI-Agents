name: Pass 15B State Write Idempotency Test

# Includes the signal/setup identity boundary regression.

on:
  push:
    branches:
      - "pass9-archive-authority"
    paths:
      - "agents/persistence_agent.py"
      - "agents/archive_agent.py"
      - "agents/lifecycle_agent.py"
      - "agents/signal_reviewer.py"
      - "agents/execution_agent.py"
      - "agents/telegram_command_agent.py"
      - "tests/test_pass17_execution_identity.py"
      - "tests/test_pass18_execution_transaction.py"
      - "tests/test_pass16_identity.py"
      - "tests/test_pass15b_idempotency.py"
      - ".github/workflows/pass15b_test.yml"
  pull_request:
    paths:
      - "agents/persistence_agent.py"
      - "tests/test_pass15b_idempotency.py"
      - ".github/workflows/pass15b_test.yml"

jobs:
  pass15b:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Run Pass 15B idempotency proof
        run: python -m unittest tests/test_pass15b_idempotency.py
      - name: Run Pass 16 identity proof
        run: python -m unittest tests/test_pass16_identity.py
      - name: Run Pass 17 execution identity proof
        run: python -m unittest tests/test_pass17_execution_identity.py
      - name: Run Pass 18 execution transaction proof
        run: python -m unittest tests/test_pass18_execution_transaction.py

      - name: Run audit findings regression proof
        run: python -m unittest tests/test_audit_findings.py
