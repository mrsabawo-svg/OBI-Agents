name: MT5 Connector Tests

on:
  push:
    branches:
      - feat/data-foundation-raw-observations
  pull_request:
    branches:
      - main
      - feat/data-foundation-raw-observations

permissions:
  contents: read

jobs:
  unit-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install project dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install pytest
      - name: Run connector, bridge, and data-foundation tests
        run: |
          python -m pytest -q \
            tests/test_mt5_connector.py \
            tests/test_mt5_bridge.py \
            tests/test_data_foundation.py \
            tests/test_history_completeness.py \
            tests/test_canonical_data_store.py \
            tests/test_feature_lineage.py
