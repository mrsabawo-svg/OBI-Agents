name: MT5 Connector Tests

on:
  push:
    branches:
      - feat/mt5-readonly-connector
  pull_request:
    branches:
      - feat/data-foundation-raw-observations

jobs:
  unit-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install project dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install Flask pytest
      - name: Run connector and bridge tests
        run: |
          python -m pytest -q tests/test_mt5_connector.py tests/test_mt5_bridge.py tests/test_data_foundation.py tests/test_history_completeness.py
