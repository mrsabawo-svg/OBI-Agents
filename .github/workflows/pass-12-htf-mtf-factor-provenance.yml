name: Pass 12 HTF MTF Factor Provenance

on:
  push:
    branches:
      - pass-12-htf-mtf-factor-provenance
  workflow_dispatch:

jobs:
  htf-mtf-provenance:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install test dependencies
        run: pip install pandas numpy pytest
      - name: Run factor provenance tests
        run: python -m pytest -q tests/test_htf_mtf_factor_provenance.py
