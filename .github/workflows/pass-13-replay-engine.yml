name: Pass 13 Replay Engine

on:
  push:
    branches:
      - pass-13-production-direction-replay
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  replay-engine:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install test dependencies
        run: python -m pip install --upgrade pip pandas numpy pytest

      - name: Run replay engine tests
        run: python -m pytest -q tests/test_replay_engine.py
