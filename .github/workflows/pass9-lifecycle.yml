name: Pass 9 Lifecycle Integrity

on:
  push:
    branches:
      - pass-9-lifecycle-integrity
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  lifecycle-integrity:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install test dependencies
        run: pip install pytest pandas pytz yfinance requests

      - name: Run Pass 9 controlled lifecycle test
        run: pytest -q tests/test_pass9_lifecycle_integrity.py
