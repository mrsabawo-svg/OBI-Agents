name: Pass 14 Lifecycle State Machine Test

on:
  push:
    branches:
      - "pass9-archive-authority"
    paths:
      - "agents/lifecycle_agent.py"
      - "tests/test_pass12_lifecycle.py"
      - "tests/test_pass14_lifecycle.py"
      - ".github/workflows/pass14_test.yml"
  pull_request:
    paths:
      - "agents/lifecycle_agent.py"
      - "tests/test_pass12_lifecycle.py"
      - "tests/test_pass14_lifecycle.py"
      - ".github/workflows/pass14_test.yml"

jobs:
  pass14:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Run Pass 14 state machine proof
        run: |
          # Explicit Pass 14 regression trigger/verification step.
          python -m unittest tests/test_pass12_lifecycle.py
          python -m unittest tests/test_pass14_lifecycle.py
