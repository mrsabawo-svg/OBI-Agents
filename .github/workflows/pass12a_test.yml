name: Pass 12A Orchestration Integrity Test

on:
  pull_request:
    paths:
      - "main.py"
      - "tests/test_pass12_orchestration.py"
      - ".github/workflows/pass12a_test.yml"

jobs:
  pass12a:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Run Pass 12A regression test
        run: python -m unittest tests/test_pass12_orchestration.py
