name: Pass 13 Stage 2 Production Direction Replay

on:
  push:
    branches: [pass-13-stage2-production-replay]
  workflow_dispatch:

jobs:
  production-direction-replay:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install replay dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pandas numpy pytz yfinance ta hmmlearn

      - name: Run production historical direction replay
        run: python -m replay.production_runner

      - name: Upload replay evidence
        uses: actions/upload-artifact@v4
        with:
          name: pass-13-stage2-replay-results
          path: replay_stage2_results.json
          if-no-files-found: error
